<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
    </head>

    <body>
        <p><b>Canvas Width</b></p>
        <input id="canvasWidth" value="1920" onfocus="this.select()"></input>
        <p><b>Canvas Height</b></p>
        <input id="canvasHeight" value="1080" onfocus="this.select()"></input>
        <p><b>Canvas Color</b></p>
        <input id="canvasColor" value="#ea0" onfocus="this.select()"></input>
        <p></p>
        <button id="applyButton">Generate/Clear</button>
        <p></p>


        <p><b>Stroke Width</b></p>
        <input id="strokeWidthInput" value="4" onfocus="this.select()"></input>
        <p></p>
        <p><b>Stroke Color</b></p>
        <input id="strokeColorInput" value="#000" onfocus="this.select()"></input>
        <p></p>
        <canvas width="800" height="600" onfocus="this.select()"></canvas>
    </body>
</html>
